	document.getElementById("pressplay").addEventListener("click", function() {
		var myAudio = new Audio('soundtrack.opus');

		    this.currentTime = 0;
		    this.play();
		}, false);
		myAudio.play();
		document.getElementById("pressplay").style.display = "none"

	// Explicitly set passive to false if supported to disable FF/Chrome scroll optimizations

		window.addEventListener('test', null, Object.defineProperty({}, 'passive', { get: function() {

		load("img/powerline.png", "powerline"),
		load("img/txt-move.png", "tut-move"),
		load("img/txt-cut.png", "tut-cut"),

	]

	Promise.all(promises).then(function() {

		spritesLoaded()
	});

function tick() {
	// Calculate time since last frame
	var deltaTime =  +new Date - prevTime;
	prevTime = +new Date;

	// Tick all tweens
	for(var i = 0; i < game.tweens.length; i++){
		game.tweens[i].tick(deltaTime);
	}

	if(game.player.moving) {
		if(game.player.movingLeft)
			game.player.x -= 1
		else
			game.player.x += 1
	}

	game.player.y += game.player.vspeed * deltaTime * 0.1
	game.player.vspeed += 0.1
	game.player.y = Math.min(game.player.y, game.ground[Math.floor(game.player.x)])

	ctx.clearRect(0, 0, canvas.width, canvas.height);
	drawBurn()
	requestAnimationFrame(tick)
}

function spritesLoaded() {
	game.tweens.push(createjs.Tween.get(game.burn).to({opacity: 1}, 4000, createjs.Ease.cubicOut));
	game.tweens.push(createjs.Tween.get(game.burn).to({y: 0}, 2000, createjs.Ease.cubicOut));

	game.tweens.push(createjs.Tween.get(game.burn, {loop:true}).to({starCycle: 100}, 1000, createjs.Ease.circInOut).to({starCycle: 70}, 800, createjs.Ease.circInOut));
}

function drawBurn() {
	if(!game.spritesLoaded)
		return
	drawScaled(ctx, game.img["sky"], 0, 0)

	ctx.globalAlpha = game.burn.starOpacity * (game.burn.starCycle / 100)
	drawScaled(ctx, game.img["stars"], 0, 0)
	ctx.globalAlpha = 1

	drawScaled(ctx, game.img["hills"], 0, 0)
	drawScaled(ctx, game.img["powerline"], 0, 0)

	ctx.globalCompositeOperation = "overlay"
	ctx.globalAlpha = game.burn.opacity;
	drawScaled(ctx, game.img["burn"], 0, game.burn.y)
	ctx.globalAlpha = 1;
	ctx.globalCompositeOperation = "source-over"

	drawScaled(ctx, game.img["player"], game.player.x, game.player.y)
	drawScaled(ctx, game.img["tut-move"], 0, 0)
}

function cut() {
	game.tweens.push(createjs.Tween.get(game.burn).to({starOpacity: 1}, 2000, createjs.Ease.cubicInOut));
}

function drawScaled(ctx, img, sx, sy){
	if(game.debug) {
		ctx.strokeStyle = "#00ff00"
		ctx.strokeRect(sx, sy, img.width, img.height)
	}

	ctx.drawImage(img, sx, sy, img.width, img.height);
}

function load(img, target) {
	return new Promise(function(resolve, reject) {
		var imageData = new Image();
		imageData.src = img;
		imageData.onload = function() {
			game.img[target] = imageData
			resolve();
		};
		imageData.onerror = function() {
			console.log("loading " + target + " failed")
			reject()
		}
	});
}

function layout(){
	width = window.innerWidth
	height = window.innerHeight
	canvas = document.getElementById("c")
	ctx = canvas.getContext("2d")

	canvas.width = 250;
	canvas.height = 125;
}

window.onresize = function(event) {
	layout()
};

screen.orientation.addEventListener("change", () => {
  layout()
});

function shuffle(array) {
  let currentIndex = array.length;
  while (currentIndex != 0) {
    let randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [
      array[randomIndex], array[currentIndex]];
  }
}

function randomDraw(array) {
	if(!ranDrawState.has(array)) {
		shuffle(array)
		ranDrawState.set(array, {index: 0, last: null})
	}

	const state = ranDrawState.get(array)
	let res = array[state.index]

	if(state.index == 0 && res == state.last && array.length > 1) {
		state.index = 1
		res = array[state.index]
	}

	state.index += 1
	if(state.index >= array.length) {
		state.index = 0
		state.last = res
		shuffle(array)
	}

	return res
}
