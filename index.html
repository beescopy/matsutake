<script type="text/javascript">

	tweens: [],
	spritesLoaded: false,
	debug: false,
	player: { x: 30, y: 105, vspeed: 0, movingLeft: false, movingRight: false },
    burn: { time: 0, glitch: 0, cut: false, y: 10.5, opacity: 0, starOpacity: 0.3, starCycle: 70, moveOpacity: 1, cutOpacity: 0, yOffset: 0},
	bury: { time: 0, glitch: 0, y: 0, opacity: 0},
	ground: [103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 105, 105, 105, 105, 105, 105, 105, 105, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 105, 105, 105, 105, 105, 105, 105, 105, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 103, 103, 103, 103, 103, 103, 103, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 103, 103, 103, 103, 103, 103, 103, 102, 102, 102, 102, 102, 102, 102, 102, 102, 102, 102, 102, 102, 102, 101, 99, 97, 95, 93, 90, 89, 89, 89, 89, 90, 92, 93, 96, 98, 101, 104, 104, 104, 105, 105, 105, 105, 105, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 106, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 105, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 104, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103, 103]
}
const ranDrawState = new Map()
var canvas
var ctx
var prevTime

window.requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame || window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;

window.addEventListener("load", function() {
	init()


	document.getElementById("pressplay").addEventListener("click", function() {
		game.music = new Audio('aud/burn-bg.mp3');
        game.music.volume = 1;
		game.music.addEventListener('ended', function() {
		    this.currentTime = 0;
		    this.play();
		}, false);
		game.music.play();
		document.getElementById("pressplay").style.display = "none"
		window.setTimeout(function(){ say("burn") }, 1000)
	})
})

function init(){
	layout()
	prevTime = new Date().getTime()

	game.img = { }
	game.controls = new Controls()

	document.addEventListener('keydown', game.controls.keyDownListener);
	document.addEventListener('keyup', game.controls.keyUpListener);
	document.addEventListener('keypress', game.controls.keyPressListener);

	/*document.addEventListener('mousedown', function(e) {

	}, true);

	document.addEventListener('touchstart', function(e) {
		if(!game.controls.isTouch)
			game.controls.isTouch = true; // Detect touch interface and ignore duplicate mouse input accordingly
		for(var i = 0; i < e.changedTouches.length; i++)
			game.controls.pressHandler(e.changedTouches[i].clientX, e.changedTouches[i].clientY, e.changedTouches[i].identifier)
		e.preventDefault();
	}, true);*/

	// Explicitly set passive to false if supported to disable FF/Chrome scroll optimizations
	var passiveIfSupported = true;
	try{
		window.addEventListener('test', null, Object.defineProperty({}, 'passive', { get: function() {
			passiveIfSupported = { passive: false };
		} }));
	}
	catch(err) {}

	// Kind of prevents unintentional zooming on mobile Safari
	document.addEventListener('gesturestart', function(e) {
		e.preventDefault();
	});

	promises = [
		load("img/txt-burn-01.png", "burn"),
		load("img/txt-burn-02.png", "burn-g1"),
		load("img/txt-burn-03.png", "burn-g2"),
		load("img/txt-burn-04.png", "burn-g3"),
		load("img/stars.png", "stars"),
		load("img/hills.png", "hills"),
		load("img/sky.png", "sky"),
		load("img/powerline-01.png", "powerline1"),
		load("img/powerline-02.png", "powerline2"),
		load("img/powerline-03.png", "powerline-cut"),
		load("img/txt-move.png", "tut-move"),
		load("img/txt-cut.png", "tut-cut"),
		load("img/player.png", "player"),
        load("img/player-left.png", "player-left"),
        load("img/desk-01.png", "desk1"),
        load("img/desk-02.png", "desk2"),
        load("img/txt-bury-01.png", "bury-g01"),
        load("img/txt-bury-02.png", "bury-g02"),
        load("img/txt-bury-03.png", "bury-g03"),
        load("img/txt-bury-04.png", "bury-g04"),
        load("img/txt-bury-05.png", "bury-g05"),

        load("img/txt-bury-07.png", "bury-g07"),
        load("img/txt-bury-08.png", "bury-g08"),
        load("img/txt-bury-09.png", "bury-g09"),
        load("img/txt-bury-10.png", "bury-g10"),
		load("img/doc-01.png", "doc-01"),
	]

	Promise.all(promises).then(function() {
		console.log("imgs loaded")
		game.spritesLoaded = true;
		spritesLoaded()
	});

	tick()

function tick() {
	// Calculate time since last frame
	var deltaTime =  +new Date - prevTime;
	prevTime = +new Date;

	// Tick all tweens
	for(var i = 0; i < game.tweens.length; i++){
		game.tweens[i].tick(deltaTime);
	}

	if(game.player.moving) {
		if(game.player.movingLeft)
			game.player.x -= deltaTime * 0.08
		else
			game.player.x += deltaTime * 0.08
	}

	game.player.x = Math.max(0, Math.min(game.player.x, 245))

	game.player.y += game.player.vspeed * deltaTime * 0.1
	game.player.vspeed += 0.1
	game.player.y = Math.min(game.player.y, game.ground[Math.floor(game.player.x)])

	ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (game.currentView == "burn") {
        drawBurn(deltaTime)
    } else if (game.currentView == "bury") {
        drawBury(deltaTime)
    }
	requestAnimationFrame(tick)
}

function spritesLoaded() {
	game.tweens.push(createjs.Tween.get(game.burn).to({opacity: 1}, 4000, createjs.Ease.cubicOut));
	game.tweens.push(createjs.Tween.get(game.burn).to({y: 0}, 2000, createjs.Ease.cubicOut));

	game.tweens.push(createjs.Tween.get(game.burn, {loop:true}).to({starCycle: 100}, 1000, createjs.Ease.circInOut).to({starCycle: 70}, 800, createjs.Ease.circInOut));
}

function drawBurn(deltaTime) {
	if(!game.spritesLoaded)
		return

	game.burn.time = (game.burn.time + deltaTime) % 5000
	const powerlineFrame = Math.floor(game.burn.time / 750) % 2

	if(game.burn.glitch == 0 && chance(20, deltaTime))
		game.burn.glitch = Math.floor(Math.random()*4)
	else if(game.burn.glitch != 0 && chance(15, deltaTime))
		game.burn.glitch = 0
	else if(game.burn.glitch != 0 && chance(7, deltaTime))
		game.burn.glitch = 1 + Math.floor(Math.random()*3)

	drawScaled(ctx, game.img["sky"], 0, game.burn.yOffset)

	ctx.globalAlpha = game.burn.starOpacity * (game.burn.starCycle / 100)
	drawScaled(ctx, game.img["stars"], 0, game.burn.yOffset)
	ctx.globalAlpha = 1

    drawScaled(ctx, game.img["hills"], 0, game.burn.yOffset)

	if(game.burn.cut)
		drawScaled(ctx, game.img["powerline-cut"], 0, game.burn.yOffset)
	else if(powerlineFrame == 0){
		drawScaled(ctx, game.img["powerline1"], 0, game.burn.yOffset)
	}
	else {
		drawScaled(ctx, game.img["powerline2"], 0, game.burn.yOffset)
	}

	ctx.globalCompositeOperation = "overlay"
	ctx.globalAlpha = game.burn.opacity;
	if(game.burn.glitch == 0)
		drawScaled(ctx, game.img["burn"], 0, game.burn.y + game.burn.yOffset)
	else if(game.burn.glitch == 1)
		drawScaled(ctx, game.img["burn-g1"], 0, game.burn.y + game.burn.yOffset)
	else if(game.burn.glitch == 2)
		drawScaled(ctx, game.img["burn-g2"], 0, game.burn.y + game.burn.yOffset)
	else if(game.burn.glitch == 3)
		drawScaled(ctx, game.img["burn-g3"], 0, game.burn.y + game.burn.yOffset)
	ctx.globalAlpha = 1;
	ctx.globalCompositeOperation = "source-over"

	drawScaled(ctx, game.player.movingLeft ? game.img["player-left"] : game.img["player"], Math.round(game.player.x), Math.round(game.player.y) + game.burn.yOffset)

	ctx.globalAlpha = game.burn.moveOpacity
	drawScaled(ctx, game.img["tut-move"], 0, game.burn.yOffset)
	ctx.globalAlpha = game.burn.cutOpacity
	drawScaled(ctx, game.img["tut-cut"], 0, game.burn.yOffset)
	ctx.globalAlpha = 1
}


function drawBury(deltaTime) {
	if(!game.spritesLoaded)
		return
    ctx.globalAlpha = game.bury.opacity;
    game.bury.time = (game.bury.time + deltaTime) % 5000
	const deskFrame = Math.floor(game.bury.time / 750) % 2
    if(deskFrame == 0){
		drawScaled(ctx, game.img["desk1"], 0, 0)
	} else {
		drawScaled(ctx, game.img["desk2"], 0, 0)
	}

	if(game.bury.glitch != 0 && chance(5, deltaTime))
		game.bury.glitch = Math.min(game.bury.glitch + 1, 20)

    ctx.globalCompositeOperation = "overlay"

	if(game.bury.glitch == 0)
		drawScaled(ctx, game.img["bury-g01"], 0, game.bury.y)
	else if(game.bury.glitch == 1)
		drawScaled(ctx, game.img["bury-g01"], 0, game.bury.y)
	else if(game.bury.glitch == 2)
		drawScaled(ctx, game.img["bury-g02"], 0, game.bury.y)
	else if(game.bury.glitch == 3)
		drawScaled(ctx, game.img["bury-g03"], 0, game.bury.y)
	else if(game.bury.glitch == 4)
		drawScaled(ctx, game.img["bury-g04"], 0, game.bury.y)
	else if(game.bury.glitch == 5)
		drawScaled(ctx, game.img["bury-g05"], 0, game.bury.y)
	else if(game.bury.glitch == 6)
		drawScaled(ctx, game.img["bury-g06"], 0, game.bury.y)
	else if(game.bury.glitch == 7)
		drawScaled(ctx, game.img["bury-g07"], 0, game.bury.y)
	else if(game.bury.glitch == 8)
		drawScaled(ctx, game.img["bury-g08"], 0, game.bury.y)
	else if(game.bury.glitch == 9)
		drawScaled(ctx, game.img["bury-g09"], 0, game.bury.y)
	else if(game.bury.glitch == 10)
		drawScaled(ctx, game.img["bury-g10"], 0, game.bury.y)

    ctx.globalCompositeOperation = "source-over"
	if(game.bury.glitch == 20)
        drawScaled(ctx, game.img["doc-01"], 0, game.bury.y)


}



function cut() {
	if(Math.abs(game.player.x - 120) > 5 || game.burn.cut)
		return

	game.tweens.push(createjs.Tween.get(game.burn).to({starOpacity: 1}, 2000, createjs.Ease.cubicInOut));
	game.burn.cut = true

    game.music.pause();
    window.setTimeout(function(){ say("bury") }, 1000)
    window.setTimeout(function(){ startBury() }, 5000)

    window.setTimeout(function(){game.tweens.push(createjs.Tween.get(game.burn).to({yOffset: -125}, 2000, createjs.Ease.linearGradient)) }, 3000);
}

function startBury(){
    window.setTimeout(function(){ game.currentView = "bury" }, 0)
    game.tweens.push(createjs.Tween.get(game.bury).to({opacity: 1}, 2000, createjs.Ease.cubicOut));
    window.setTimeout(function(){ game.bury.glitch = 1 }, 2200)

}

function firstmove() {
	game.tweens.push(createjs.Tween.get(game.burn).to({moveOpacity: 0}, 2000, createjs.Ease.cubicIn));
	game.tweens.push(createjs.Tween.get(game.burn).wait(4000).to({cutOpacity: 1}, 3000, createjs.Ease.cubicOut).wait(3000).to({cutOpacity: 0}, 4000, createjs.Ease.cubicIn));
}

function say(line) {
	var myAudio = new Audio(`aud/${line}-tts.mp3`);
    myAudio.volume = 0.5;
	myAudio.play();
}

function drawScaled(ctx, img, sx, sy){
	if(game.debug) {
		ctx.strokeStyle = "#00ff00"
		ctx.strokeRect(sx, sy, img.width, img.height)
	}

	ctx.drawImage(img, sx, sy, img.width, img.height);
}

function load(img, target) {
	return new Promise(function(resolve, reject) {
		var imageData = new Image();
		imageData.src = img;
		imageData.onload = function() {
			game.img[target] = imageData
			resolve();
		};
		imageData.onerror = function() {
			console.log("loading " + target + " failed")
			reject()
		}
	});
}

function chance(prob, deltaTime){
	return Math.random() < deltaTime / (33 * prob);
}

function layout(){
	width = window.innerWidth
	height = window.innerHeight
	canvas = document.getElementById("c")
	ctx = canvas.getContext("2d")

	canvas.width = 250;
	canvas.height = 125;
}

window.onresize = function(event) {
	layout()
};

screen.orientation.addEventListener("change", () => {
  layout()
});

function shuffle(array) {
  let currentIndex = array.length;
  while (currentIndex != 0) {
    let randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [
      array[randomIndex], array[currentIndex]];
  }
}

function randomDraw(array) {
	if(!ranDrawState.has(array)) {
		shuffle(array)
		ranDrawState.set(array, {index: 0, last: null})
	}

	const state = ranDrawState.get(array)
	let res = array[state.index]

	if(state.index == 0 && res == state.last && array.length > 1) {
		state.index = 1
		res = array[state.index]
	}

	state.index += 1
	if(state.index >= array.length) {
		state.index = 0
		state.last = res
		shuffle(array)
	}

	return res
}
